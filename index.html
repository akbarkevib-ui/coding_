<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Coding Academy</h1>
        <nav>
            <button onclick="showSection('gallery')" class="nav-btn active" id="btn-gallery">Gallery</button>
            <button onclick="showSection('pendaftaran')" class="nav-btn" id="btn-pendaftaran">Pendaftaran</button>
        </nav>
    </header>

    <main>
        <!-- Halaman Gallery -->
        <section id="gallery" class="section active">
            <h2>Gallery Kegiatan Pelatihan</h2>
            <div class="gallery-grid">
                <div class="gallery-card">
                    <img src="gambar1.jpg" alt="Fokus Coding">
                    <p>Fokus dan Semangat Ngoding!</p>
                </div>
                <div class="gallery-card">
                    <img src="gambar2.jpg" alt="Diskusi Tim">
                    <p>Diskusi Tim: Teamwork Better Ideas!</p>
                </div>
                <div class="gallery-card">
                    <img src="gambar3.jpg" alt="Demo Day">
                    <p>Presentasi Proyek - Demo Day!</p>
                </div>
            </div>
        </section>

        <!-- Halaman Pendaftaran -->
        <section id="pendaftaran" class="section">
            <h2>Form Pendaftaran</h2>
            <div class="form-container">
                <form id="formDaftar">
                    <div class="form-group">
                        <label for="nik">NIK:</label>
                        <input type="number" id="nik" required placeholder="Masukkan NIK Anda">
                    </div>
                    
                    <div class="form-group">
                        <label for="nama">Nama Lengkap:</label>
                        <input type="text" id="nama" required placeholder="Masukkan Nama Lengkap">
                    </div>

                    <div class="form-group">
                        <label>Jenis Kelamin:</label>
                        <div class="radio-group">
                            <input type="radio" id="pria" name="jk" value="Laki-laki" required>
                            <label for="pria">Laki-laki</label>
                            
                            <input type="radio" id="wanita" name="jk" value="Perempuan">
                            <label for="wanita">Perempuan</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="nohp">No HP:</label>
                        <input type="tel" id="nohp" required placeholder="Contoh: 08123456789">
                    </div>

                    <div class="form-group">
                        <label for="alamat">Alamat:</label>
                        <textarea id="alamat" rows="3" required placeholder="Masukkan Alamat Lengkap"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="bahasa">Bahasa Pemrograman yang Diminati:</label>
                        <select id="bahasa" required>
                            <option value="">-- Pilih Bahasa Pemrograman --</option>
                            <option value="Python">Python</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="Java">Java</option>
                            <option value="C++">C++</option>
                            <option value="PHP">PHP</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">Simpan Pendaftaran</button>
                </form>

                <!-- Area Hasil Pendaftaran -->
                <div id="hasilPendaftaran" class="hidden">
                    <h3>Hasil Data Pendaftaran:</h3>
                    <ul>
                        <li><strong>NIK:</strong> <span id="res-nik"></span></li>
                        <li><strong>Nama Lengkap:</strong> <span id="res-nama"></span></li>
                        <li><strong>Jenis Kelamin:</strong> <span id="res-jk"></span></li>
                        <li><strong>No HP:</strong> <span id="res-nohp"></span></li>
                        <li><strong>Alamat:</strong> <span id="res-alamat"></span></li>
                        <li><strong>Bahasa Diminati:</strong> <span id="res-bahasa"></span></li>
                    </ul>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
